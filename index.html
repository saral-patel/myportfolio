<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f172a;
    overflow-x:hidden;
}

.hero{
    min-height:100vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:80px;
    padding:120px 10%;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #312e81
    );
    position:relative;
}

.hero::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#6366f133;
    border-radius:50%;
    top:-150px;
    right:-150px;
    filter:blur(100px);
}

.hero::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#06b6d433;
    border-radius:50%;
    bottom:-150px;
    left:-150px;
    filter:blur(100px);
}

.content{
    max-width:650px;
    z-index:2;
}

.tag{
    display:inline-block;
    padding:12px 22px;
    border-radius:50px;
    background:rgba(255,255,255,.08);
    color:#38bdf8;
    margin-bottom:20px;
}

.content h1{
    color:#fff;
    font-size:4rem;
    line-height:1.2;
}

.content h1 span{
    color:#6366f1;
}

.typing{
    font-size:2rem;
    color:#a78bfa;
    height:50px;
    margin-top:10px;
}

.desc{
    color:#cbd5e1;
    margin-top:25px;
    line-height:1.8;
    font-size:1.1rem;
}

.btn-group{
    margin-top:40px;
    display:flex;
    gap:20px;
}

.btn{
    text-decoration:none;
    padding:15px 35px;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.btn-primary{
    background:#6366f1;
    color:#fff;
}

.btn-primary:hover{
    transform:translateY(-5px);
}

.btn-secondary{
    border:2px solid #6366f1;
    color:#fff;
}

.btn-secondary:hover{
    background:#6366f1;
}

.profile{
    z-index:2;
}

.profile-card{
    width:420px;
    height:520px;
    padding:8px;
    border-radius:30px;
    background:linear-gradient(
        135deg,
        #6366f1,
        #06b6d4
    );
    box-shadow:0 20px 60px rgba(99,102,241,.4);
    animation:float 4s ease-in-out infinite;
}

.profile-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:25px;
    display:block;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-20px);
    }
}

@media(max-width:992px){

.hero{
    flex-direction:column-reverse;
    text-align:center;
    padding:80px 20px;
}

.content h1{
    font-size:2.8rem;
}

.typing{
    font-size:1.5rem;
}

.profile-card{
    width:300px;
    height:380px;
}

.btn-group{
    justify-content:center;
    flex-wrap:wrap;
}

}

</style>
</head>

<body>

<header id="header"></header>

<section class="hero">

<div class="content">

    <div class="tag">
        👋 Welcome To My Portfolio
    </div>

    <h1>
        Hi, I'm <span>Saral Patel</span>
    </h1>

    <div class="typing" id="typing"></div>

    <p class="desc">
        Full Stack Developer specializing in Angular, Django,
        Python, JavaScript, REST APIs and modern web applications.
        Passionate about creating scalable and beautiful software solutions.
    </p>

    <div class="btn-group">
        <a href="#" class="btn btn-primary">Hire Me</a>
        <a href="#" class="btn btn-secondary">Download CV</a>
    </div>

</div>

<div class="profile">
    <div class="profile-card">

        <!-- Image Path -->
        <img src="./image/profile.jpg" alt="Saral Patel">

    </div>
</div>

</section>

<script>

fetch('header.html')
.then(response => response.text())
.then(data => {
    document.getElementById('header').innerHTML = data;
});

const words = [
    "Full Stack Developer",
    "Angular Developer",
    "Python Developer",
    "Django Developer",
    "Frontend Designer"
];

let wordIndex = 0;
let charIndex = 0;

function typeEffect(){

    if(wordIndex >= words.length){
        wordIndex = 0;
    }

    let currentWord = words[wordIndex];
    let currentChar = currentWord.slice(0, ++charIndex);

    document.getElementById("typing").textContent = currentChar;

    if(currentChar.length === currentWord.length){

        setTimeout(eraseEffect,1500);
        return;
    }

    setTimeout(typeEffect,100);
}

function eraseEffect(){

    let currentWord = words[wordIndex];
    let currentChar = currentWord.slice(0, --charIndex);

    document.getElementById("typing").textContent = currentChar;

    if(charIndex === 0){
        wordIndex++;
        setTimeout(typeEffect,300);
        return;
    }

    setTimeout(eraseEffect,50);
}

typeEffect();

</script>

</body>
</html>
